name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # google-chrome is preinstalled on GitHub's ubuntu runners
      - run: npm test
        env:
          CHROME_BIN: /usr/bin/google-chrome
